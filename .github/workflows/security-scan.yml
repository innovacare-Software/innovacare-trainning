name: Security Scan

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: GitHub Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run dependency review
        uses: actions/dependency-review-action@v4

  audit-and-secret-scan:
    name: Audit, Vulnerability, and Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install default Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install secondary Functions dependencies
        run: npm ci
        working-directory: innovacare-training

      - name: Run root npm audit
        id: audit_root
        continue-on-error: true
        shell: bash
        run: npm audit --audit-level=high --json > root-npm-audit.json

      - name: Run default Functions npm audit
        id: audit_functions
        continue-on-error: true
        shell: bash
        run: npm audit --audit-level=high --json > functions-npm-audit.json
        working-directory: functions

      - name: Run secondary Functions npm audit
        id: audit_training
        continue-on-error: true
        shell: bash
        run: npm audit --audit-level=high --json > innovacare-training-npm-audit.json
        working-directory: innovacare-training

      - name: Run tracked-file secret detection
        id: tracked_secret_scan
        continue-on-error: true
        shell: bash
        run: |
          if git grep -nE '(AIza[0-9A-Za-z_-]{35}|sk_(live|test)_[0-9A-Za-z]+|whsec_[0-9A-Za-z]+|-----BEGIN PRIVATE KEY-----|"type"\s*:\s*"service_account")' \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)docs/**' \
            ':(exclude)build-*.txt' \
            ':(exclude)deploy-*.txt' \
            ':(exclude)tmp-*.txt' > secret-scan-report.txt; then
            cat secret-scan-report.txt
            echo "Potential hardcoded secret detected in tracked files."
            exit 1
          fi
          echo "No tracked hardcoded secrets detected by pattern scan." > secret-scan-report.txt

      - name: Run Trivy vulnerability and secret scan
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            root-npm-audit.json
            functions/functions-npm-audit.json
            innovacare-training/innovacare-training-npm-audit.json
            secret-scan-report.txt
            trivy-results.sarif
          if-no-files-found: error

      - name: Enforce security gates
        if: always()
        shell: bash
        run: |
          failures=0
          for result in \
            "${{ steps.audit_root.outcome }}" \
            "${{ steps.audit_functions.outcome }}" \
            "${{ steps.audit_training.outcome }}" \
            "${{ steps.tracked_secret_scan.outcome }}" \
            "${{ steps.trivy_scan.outcome }}"; do
            if [ "$result" != "success" ]; then
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "One or more security gates failed. Review uploaded reports and GitHub code scanning findings."
            exit 1
          fi
