name: Security Scan

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-secret-scan:
    name: Audit, Vulnerability, and Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install default Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install secondary Functions dependencies
        run: npm ci
        working-directory: innovacare-training

      - name: Run root npm audit
        id: root_npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > root-npm-audit.json

      - name: Run default Functions npm audit
        id: functions_npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > functions-npm-audit.json
        working-directory: functions

      - name: Run secondary Functions npm audit
        id: secondary_functions_npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > innovacare-training-npm-audit.json
        working-directory: innovacare-training

      - name: Run tracked-file secret detection
        id: tracked_secret_scan
        continue-on-error: true
        shell: bash
        run: |
          if git grep -nE '(AIza[0-9A-Za-z_-]{35}|sk_(live|test)_[0-9A-Za-z]+|whsec_[0-9A-Za-z]+|-----BEGIN PRIVATE KEY-----|"type"\s*:\s*"service_account")' \
            -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude)package-lock.json' \
            ':(exclude)docs/**' \
            ':(exclude)functions/.env.example' \
            ':(exclude)lighthouse*.json' \
            ':(exclude)build-*.txt' \
            ':(exclude)deploy-*.txt' \
            ':(exclude)tmp-*.txt' \
            ':(exclude)src/enviroments/enviroment.ts' > secret-scan-report.txt; then
            cat secret-scan-report.txt
            echo "Potential hardcoded secret detected in tracked files."
            exit 1
          fi
          echo "No tracked hardcoded secrets detected by pattern scan." > secret-scan-report.txt

      - name: Run Trivy vulnerability and secret scan
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            root-npm-audit.json
            functions/functions-npm-audit.json
            innovacare-training/innovacare-training-npm-audit.json
            secret-scan-report.txt
            trivy-results.sarif
          if-no-files-found: warn

      - name: Fail job on detected security findings
        if: always()
        shell: bash
        run: |
          failed=0

          if [ "${{ steps.root_npm_audit.outcome }}" = "failure" ]; then
            echo "Root npm audit reported high or critical vulnerabilities."
            failed=1
          fi

          if [ "${{ steps.functions_npm_audit.outcome }}" = "failure" ]; then
            echo "Default Functions npm audit reported high or critical vulnerabilities."
            failed=1
          fi

          if [ "${{ steps.secondary_functions_npm_audit.outcome }}" = "failure" ]; then
            echo "Secondary Functions npm audit reported high or critical vulnerabilities."
            failed=1
          fi

          if [ "${{ steps.tracked_secret_scan.outcome }}" = "failure" ]; then
            echo "Tracked-file secret detection reported a potential secret."
            failed=1
          fi

          if [ "${{ steps.trivy_scan.outcome }}" = "failure" ]; then
            echo "Trivy reported a vulnerability, secret, or configuration finding."
            failed=1
          fi

          exit "$failed"