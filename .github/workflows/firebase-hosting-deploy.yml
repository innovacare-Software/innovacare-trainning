name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: innovacare-trainning-main/package-lock.json

      - name: Install dependencies
        working-directory: innovacare-trainning-main
        run: npm ci

      - name: Build Angular app
        working-directory: innovacare-trainning-main
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVACARE_TRAINING }}
          projectId: innovacare-training
          entryPoint: innovacare-trainning-main
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
