name: Deploy Production

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Enforce main branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deployments are only allowed from the main branch."
            exit 1
          fi

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Firebase Production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}.web.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL_PRODUCTION }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install root dependencies
        run: npm ci

      - name: Install default Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install secondary Functions dependencies
        run: npm ci
        working-directory: innovacare-training

      - name: Build Angular application
        env:
          CI: true
        run: npm run build -- --configuration production

      - name: Build default Functions codebase
        run: npm run build
        working-directory: functions

      - name: Build secondary Functions codebase
        run: npm run build
        working-directory: innovacare-training

      - name: Deploy Hosting and Functions to production
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: firebase deploy --non-interactive --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only hosting,functions

      - name: Detect rules changes
        id: rules_changes
        shell: bash
        run: |
          BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          else
            CHANGED_FILES="$(git show --pretty='' --name-only "$GITHUB_SHA")"
          fi
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(firestore\.rules|firestore\.indexes\.json)$'; then
            echo "firestore_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "firestore_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^storage\.rules$'; then
            echo "storage_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "storage_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Firestore rules smoke test
        if: steps.rules_changes.outputs.firestore_changed == 'true'
        run: npm run test:rules:smoke

      - name: Deploy Firestore rules to production
        if: steps.rules_changes.outputs.firestore_changed == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: firebase deploy --non-interactive --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only firestore:rules,firestore:indexes

      - name: Deploy Storage rules to production
        if: steps.rules_changes.outputs.storage_changed == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: firebase deploy --non-interactive --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only storage

      - name: Rollback guidance
        if: always()
        run: |
          echo "Rollback reference: see docs/rollback-plan.md"
          echo "Hosting quick rollback: firebase hosting:clone <production-project>:live <production-project>:rollback-<timestamp>"
          echo "Functions rollback: redeploy the last stable commit from main or use Cloud Run revision rollback if a service is moved there later."