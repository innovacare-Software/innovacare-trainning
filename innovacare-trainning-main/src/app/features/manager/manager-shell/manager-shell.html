<div class="shell" *transloco="let t">
  <!-- TOP BAR -->
  <header class="topbar">
    <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Open menu">☰</button>
    <div class="brand"><strong>{{ t('shells.manager.brand') }}</strong></div>
    <div class="top-actions">
      <span class="role">{{ t('roles.manager') }}</span>
      <div class="avatar" title="Profile"></div>
      <app-notification-bell-plain></app-notification-bell-plain>
      <app-language-switcher></app-language-switcher>
      <button class="btn logout" (click)="logout()">{{ t('actions.logout') }}</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <nav class="menu">
      <div class="menu-group">
        <div class="menu-title">{{ t('nav.overview') }}</div>
        <a *ngFor="let i of nav()"
           [routerLink]="i.path"
           routerLinkActive="active"
           class="menu-item"
           (click)="closeSidebar()">{{ t(i.labelKey) }}</a>
      </div>

      <div class="menu-group">
        <div class="menu-title">{{ t('nav.resources') }}</div>
        <a *ngFor="let r of resources()"
           [routerLink]="r.path"
           routerLinkActive="active"
           class="menu-item"
           (click)="closeSidebar()">{{ t(r.labelKey) }}</a>

      </div>

      <div class="menu-group" *ngIf="isCouncilAdmin()">
        <div class="menu-title">Conseil</div>
        <a routerLink="/manager/council"
           routerLinkActive="active"
           class="menu-item"
           (click)="closeSidebar()">Régions</a>
      </div>
    </nav>
  </aside>

  <!-- BACKDROP -->
  <div class="backdrop" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <!-- MAIN CONTENT -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
