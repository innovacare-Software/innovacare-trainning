<div class="shell">
  <!-- TOP BAR -->
  <header class="topbar">
    <button class="menu-toggle" (click)="toggleSidebar()" [attr.aria-label]="'manager.shell.openMenu' | translate">☰</button>
    <div class="brand"><strong>{{ 'common.brand' | translate }}</strong></div>
    <div class="top-actions">
      <span class="role">{{ 'manager.shell.role' | translate }}</span>
      <div class="avatar" [title]="'common.profile' | translate"></div>
      <app-notification-bell-plain></app-notification-bell-plain>
      <app-language-switcher></app-language-switcher>
      <button class="btn logout" (click)="logout()">{{ 'common.logout' | translate }}</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <nav class="menu">
      <div class="menu-group">
        <div class="menu-title">{{ 'manager.shell.overview' | translate }}</div>
        <a *ngFor="let i of nav()"
           [routerLink]="i.path"
           routerLinkActive="active"
           class="menu-item"
           (click)="closeSidebar()">{{ i.labelKey | translate }}</a>
      </div>

      <div class="menu-group">
        <div class="menu-title">{{ 'manager.shell.resources' | translate }}</div>
        <a *ngFor="let r of resources()"
           [routerLink]="r.path"
           routerLinkActive="active"
           class="menu-item"
           (click)="closeSidebar()">{{ r.labelKey | translate }}</a>
      </div>
    </nav>
  </aside>

  <!-- BACKDROP -->
  <div class="backdrop" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <!-- MAIN CONTENT -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
