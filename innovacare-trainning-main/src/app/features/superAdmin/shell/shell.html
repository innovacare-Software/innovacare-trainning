<div class="shell" [class.side-hidden]="!sidebarOpen()">
  <header class="topbar">
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      [attr.aria-label]="'superAdmin.shell.toggleMenu' | translate">
      ☰
    </button>

    <div class="brand">
      <strong>{{ 'superAdmin.shell.brand' | translate }}</strong>
    </div>

    <div class="top-actions">
      <span class="role">{{ 'superAdmin.shell.role' | translate }}</span>
      <app-language-switcher></app-language-switcher>
      <button class="btn logout" type="button" (click)="logout()">{{ 'common.logout' | translate }}</button>
    </div>
  </header>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <nav class="menu">
      <a
        *ngFor="let item of nav"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/super-admin' }"
        class="menu-item">
        {{ item.labelKey | translate }}
      </a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
