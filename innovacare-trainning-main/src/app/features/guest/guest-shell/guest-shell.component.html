<div class="guest-shell">
  <aside class="guest-sidebar">
    <div class="brand">{{ 'guest.shell.brand' | translate }}</div>

    <div class="lang-area">
      <app-language-switcher></app-language-switcher>
    </div>

    <nav class="nav">
      <a routerLink="/guest/dashboard" routerLinkActive="active">{{ 'guest.nav.dashboard' | translate }}</a>
      <a routerLink="/guest/session/courses" routerLinkActive="active">{{ 'guest.nav.courses' | translate }}</a>
      <a routerLink="/guest/live-classes" routerLinkActive="active">{{ 'guest.nav.liveClasses' | translate }}</a>
      <a routerLink="/guest/bookings" routerLinkActive="active">{{ 'learner.assignments.title' | translate }}</a>
      <a routerLink="/guest/orders" routerLinkActive="active">{{ 'guest.nav.orders' | translate }}</a>
      <a routerLink="/guest/profile" routerLinkActive="active">{{ 'guest.nav.profile' | translate }}</a>
    </nav>

    <button class="logout-btn" (click)="logout()">{{ 'common.logout' | translate }}</button>
  </aside>

  <main class="guest-main">
    <router-outlet></router-outlet>
  </main>
</div>
