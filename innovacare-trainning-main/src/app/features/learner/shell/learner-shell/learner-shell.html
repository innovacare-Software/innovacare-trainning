<div class="shell" [class.side-hidden]="!sidebarOpen()">
  <!-- TOP BAR -->
  <header class="topbar" role="banner">
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      [attr.aria-label]="'learner.shell.toggleMenu' | translate">
      <span aria-hidden="true">☰</span>
    </button>

    <div class="brand">
      <strong>{{ 'common.brand' | translate }}</strong>
    </div>

    <div class="top-actions">
      <span class="role" [attr.aria-label]="'common.role' | translate">{{ 'learner.shell.role' | translate }}</span>
      <button class="avatar" type="button" [attr.aria-label]="'learner.shell.userProfile' | translate" [title]="'common.profile' | translate"></button>
      <app-notification-bell-plain [attr.aria-label]="'common.notifications' | translate"></app-notification-bell-plain>
      <app-language-switcher></app-language-switcher>
      <button class="btn logout" type="button" (click)="logout()" [attr.aria-label]="'common.logout' | translate">{{ 'common.logout' | translate }}</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    [class.open]="sidebarOpen()"
    [attr.aria-hidden]="!sidebarOpen()"
    role="navigation"
    [attr.aria-label]="'learner.shell.mainNav' | translate">
    <nav class="menu">
      <div class="menu-group">
        <h2 class="menu-title">{{ 'learner.shell.overview' | translate }}</h2>

        <a
          *ngFor="let l of links"
          [routerLink]="l.path"
          routerLinkActive="active"
          class="menu-item"
          (click)="onNavClick()">
          {{ l.labelKey | translate }}
        </a>
      </div>

      <div class="menu-group">
        <h2 class="menu-title">{{ 'learner.shell.resources' | translate }}</h2>

        <a
          *ngFor="let r of resources"
          [routerLink]="r.path"
          routerLinkActive="active"
          class="menu-item"
          (click)="onNavClick()">
          {{ r.labelKey | translate }}
        </a>
      </div>
    </nav>
  </aside>

  <!-- BACKDROP mobile only -->
  <div
    class="backdrop"
    *ngIf="isMobile() && sidebarOpen()"
    (click)="closeSidebar()"
    role="presentation">
  </div>

  <!-- MAIN CONTENT -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
