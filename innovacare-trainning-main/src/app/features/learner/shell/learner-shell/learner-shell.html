<div class="shell" [class.side-hidden]="!sidebarOpen()">
  <!-- TOP BAR -->
  <header class="topbar" role="banner">
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-label="Toggle navigation menu">
      <span aria-hidden="true">☰</span>
    </button>

    <div class="brand">
      <strong>INNOVACARE-TRAINING</strong>
    </div>

    <div class="top-actions">
      <span class="role" aria-label="User role">Learner</span>
      <button class="avatar" type="button" aria-label="User profile" title="Profile"></button>
      <app-notification-bell-plain aria-label="Notifications"></app-notification-bell-plain>
      <button class="btn logout" type="button" (click)="logout()" aria-label="Logout from system">Logout</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    [class.open]="sidebarOpen()"
    [attr.aria-hidden]="!sidebarOpen()"
    role="navigation"
    aria-label="Main navigation">
    <nav class="menu">
      <div class="menu-group">
        <h2 class="menu-title">Overview</h2>

        <a
          *ngFor="let l of links"
          [routerLink]="l.path"
          routerLinkActive="active"
          class="menu-item"
          (click)="onNavClick()">
          {{ l.label }}
        </a>
      </div>

      <div class="menu-group">
        <h2 class="menu-title">Resources</h2>

        <a
          *ngFor="let r of resources"
          [routerLink]="r.path"
          routerLinkActive="active"
          class="menu-item"
          (click)="onNavClick()">
          {{ r.label }}
        </a>
      </div>
    </nav>
  </aside>

  <!-- BACKDROP mobile only -->
  <div
    class="backdrop"
    *ngIf="isMobile() && sidebarOpen()"
    (click)="closeSidebar()"
    role="presentation">
  </div>

  <!-- MAIN CONTENT -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
