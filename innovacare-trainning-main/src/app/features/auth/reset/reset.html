<div class="auth">
  <div class="card">
    <div class="lang-row">
      <app-language-switcher></app-language-switcher>
    </div>
    <h1>{{ 'auth.reset.title' | translate }}</h1>
    <p class="muted">{{ 'auth.reset.subtitle' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label class="label">{{ 'auth.fields.email' | translate }}</label>
      <input class="input" type="email" formControlName="email" [placeholder]="'auth.fields.emailOrgPlaceholder' | translate" />
      <small class="help" *ngIf="form.controls.email.invalid && form.controls.email.touched">
        {{ 'auth.validation.emailRequired' | translate }}
      </small>

      <button class="btn" type="submit" [disabled]="loading()">
        <span *ngIf="!loading()">{{ 'auth.actions.sendReset' | translate }}</span>
        <span *ngIf="loading()">{{ 'auth.actions.sending' | translate }}</span>
      </button>
      <a routerLink="/login" class="btn outline" style="margin-left:8px">{{ 'auth.actions.backToLogin' | translate }}</a>
    </form>

    <p class="ok" *ngIf="success()">{{ success() }}</p>
    <p class="error" *ngIf="error()">{{ error() }}</p>
  </div>
</div>
