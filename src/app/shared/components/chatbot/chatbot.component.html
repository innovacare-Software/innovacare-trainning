<!-- Floating Action Button -->
<button
  class="chatbot-fab"
  (click)="chatbot.toggle()"
  [attr.aria-label]="chatbot.open() ? 'Close assistant' : 'Open AI assistant'"
  title="InnovaAssist – AI Helper">
  <svg *ngIf="!chatbot.open()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
    <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.52 3.66 1.42 5.18L2 22l4.82-1.42A9.944 9.944 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.95 7.95 0 01-4.07-1.12l-.29-.17-3 .88.88-3-.17-.29A7.95 7.95 0 014 12c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8z"/>
    <path d="M8.5 11h7M8.5 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <svg *ngIf="chatbot.open()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- Chat Panel -->
<div class="chatbot-panel" [class.chatbot-panel--open]="chatbot.open()" role="dialog" aria-label="InnovaAssist">

  <!-- Header -->
  <div class="chatbot-header">
    <div class="chatbot-header__info">
      <div class="chatbot-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M12 2a5 5 0 015 5 5 5 0 01-5 5 5 5 0 01-5-5 5 5 0 015-5m0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/>
        </svg>
      </div>
      <div>
        <div class="chatbot-header__name">InnovaAssist</div>
        <div class="chatbot-header__status">
          <span class="chatbot-status-dot"></span>
          <span>AI Helper</span>
        </div>
      </div>
    </div>
    <div class="chatbot-header__actions">
      <button class="chatbot-icon-btn" (click)="clearChat()" title="Clear conversation" aria-label="Clear conversation">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
      <button class="chatbot-icon-btn" (click)="chatbot.close()" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages">
    <!-- Welcome message -->
    <div *ngIf="chatbot.messages().length === 0" class="chatbot-welcome">
      <div class="chatbot-welcome__icon">🩺</div>
      <h4>Hello! I'm InnovaAssist</h4>
      <p>I can help you discover courses, enroll quickly, and get payment support.</p>
      <div class="chatbot-suggestions">
        <button class="chatbot-suggestion" (click)="chatbot.sendMessage('Show my courses')">
          My Courses
        </button>
        <button class="chatbot-suggestion" (click)="chatbot.sendMessage('Help me enroll in a course')">
          Enroll
        </button>
        <button class="chatbot-suggestion" (click)="chatbot.sendMessage('I need payment help')">
          Payment Help
        </button>
      </div>
    </div>

    <!-- Message list -->
    <div
      *ngFor="let msg of chatbot.messages(); trackBy: trackByIndex"
      class="chatbot-message"
      [class.chatbot-message--user]="msg.role === 'user'"
      [class.chatbot-message--assistant]="msg.role === 'assistant'">
      <div class="chatbot-message__bubble">{{ msg.content }}</div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="chatbot.loading()" class="chatbot-message chatbot-message--assistant">
      <div class="chatbot-message__bubble chatbot-typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>

  <!-- Input -->
  <div class="chatbot-input-area">
    <textarea
      class="chatbot-input"
      rows="1"
      placeholder="Ask a question…"
      [ngModel]="input()"
      (ngModelChange)="input.set($event)"
      (keydown)="onKeydown($event)"
      [disabled]="chatbot.loading()"
      aria-label="Your message">
    </textarea>
    <button
      class="chatbot-send-btn"
      (click)="send()"
      [disabled]="!input().trim() || chatbot.loading()"
      aria-label="Send">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>
