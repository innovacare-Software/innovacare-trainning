<div class="guest-shell" *transloco="let t">
  <aside class="guest-sidebar">
    <div class="brand">{{ t('shells.guest.brand') }}</div>

    <div class="company-type-selector">
      <label for="companyType">{{ t('shells.guest.companyTypeLabel') }}</label>
      <select id="companyType" [(ngModel)]="selectedCompanyType">
        <option value="">{{ t('shells.guest.companyTypePlaceholder') }}</option>
        <option value="healthcare">{{ t('shells.guest.healthcare') }}</option>
        <option value="corporate">{{ t('shells.guest.corporate') }}</option>
        <option value="education">{{ t('shells.guest.education') }}</option>
        <option value="other">{{ t('shells.guest.other') }}</option>
      </select>
    </div>

    <nav class="nav">
      <a routerLink="/guest/dashboard" routerLinkActive="active">{{ t('nav.dashboard') }}</a>
      <a routerLink="/guest/session/courses" routerLinkActive="active">{{ t('nav.myCourses') }}</a>
      <a routerLink="/guest/programs" routerLinkActive="active">{{ t('nav.myPrograms') }}</a>
      <a routerLink="/programs" routerLinkActive="active">{{ t('nav.programsCatalog') }}</a>
      <a routerLink="/guest/live-classes" routerLinkActive="active">{{ t('nav.liveClasses') }}</a>
      <a routerLink="/guest/bookings" routerLinkActive="active">{{ t('nav.bookings') }}</a>
      <a routerLink="/guest/orders" routerLinkActive="active">{{ t('nav.orders') }}</a>
      <a routerLink="/guest/profile" routerLinkActive="active">{{ t('nav.profile') }}</a>
    </nav>

    <app-language-switcher></app-language-switcher>
    <button class="logout-btn" (click)="logout()">{{ t('actions.logout') }}</button>
  </aside>

  <main class="guest-main">
    <router-outlet></router-outlet>
  </main>
</div>
