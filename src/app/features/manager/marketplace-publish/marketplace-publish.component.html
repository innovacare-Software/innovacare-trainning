<section class="marketplace-publish-page">
  <header class="header">
    <h1>Publish Course To Marketplace</h1>
    <p>Creates/updates the commercial offer layer in <strong>publicOffers</strong>.</p>
  </header>

  <div class="card" *ngIf="!isSuperAdmin">
    <p>Publishing is centralized to super admin only.</p>
  </div>

  <form class="card" [formGroup]="form" (ngSubmit)="publish()" *ngIf="isSuperAdmin">
    <label>
      Course ID
      <input type="text" formControlName="courseId" placeholder="course_abc123" />
    </label>

    <label>
      Price
      <input type="number" min="0.01" step="0.01" formControlName="price" />
    </label>

    <label>
      Currency
      <input type="text" formControlName="currency" maxlength="8" placeholder="USD" />
    </label>

    <label>
      Stripe Price ID
      <input type="text" formControlName="stripePriceId" placeholder="price_..." />
    </label>

    <label class="checkbox">
      <input type="checkbox" formControlName="isPublic" />
      Visible to public catalogue
    </label>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Publishing...' : 'Publish Course' }}
    </button>
  </form>
</section>
