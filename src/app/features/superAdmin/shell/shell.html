<div class="shell" [class.side-hidden]="!sidebarOpen()" *transloco="let t">
  <header class="topbar">
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-label="Toggle menu">
      ☰
    </button>

    <div class="brand">
      <strong>{{ t('shells.superAdmin.brand') }}</strong>
    </div>

    <div class="top-actions">
      <span class="role">Level 1 · {{ t('roles.superAdmin') }}</span>
      <app-global-search-trigger></app-global-search-trigger>
      <app-onboarding-trigger></app-onboarding-trigger>
      <a routerLink="/admin-spaces" class="btn route-link">Switch Admin Space</a>
      <a routerLink="/program-admin/dashboard" class="btn route-link">Program Admin Workspace</a>
      <a routerLink="/org-admin/dashboard" class="btn route-link">Organization Admin Workspace</a>
      <app-language-switcher></app-language-switcher>
      <button class="btn logout" type="button" (click)="logout()">{{ t('actions.logout') }}</button>
    </div>
  </header>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <nav class="menu">
      <a
        *ngFor="let item of nav"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/super-admin' }"
        class="menu-item">
        {{ t(item.labelKey) }}
      </a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
