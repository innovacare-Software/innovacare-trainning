<section class="page">
  <div class="page-head">
    <h1>Users</h1>
    <p>Manage roles, account state, and basic user administration.</p>
  </div>

  <div class="panel">
    <div class="filters">
      <input [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Search user by email / name / uid" />
      <select [ngModel]="roleFilter()" (ngModelChange)="roleFilter.set($event)">
        <option value="">All roles</option>
        <option value="super_admin">Super Admin</option>
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="learner">Learner</option>
        <option value="guest">Guest</option>
        <option value="instructor">Instructor</option>
        <option value="tutor">Tutor</option>
        <option value="staff">Staff</option>
        <option value="programAdmin">Program Admin</option>
        <option value="programStaff">Program Staff</option>
        <option value="programLearner">Program Learner</option>
      </select>
      <button class="btn" (click)="refresh()">Apply</button>
      <button class="btn" (click)="normalizeAllUsers()">Normalize legacy program roles</button>
    </div>

    <p class="notice" *ngIf="notice()">{{ notice() }}</p>
  </div>

  <div class="panel">
    <div class="table">
      <div class="thead">
        <div>Email</div>
        <div>Name</div>
        <div>Role</div>
        <div>Status</div>
        <div>Actions</div>
      </div>

      <div class="tbody">
        <div class="tr" *ngFor="let u of users()">
          <div>{{ u.email }}</div>
          <div>{{ u.displayName || '—' }}</div>
          <div>{{ u.role }}</div>
          <div>
            {{ u.active ? 'Active' : 'Disabled' }}
            <span *ngIf="u.isProgramAdmin" class="tag-program-admin">Program Admin</span>
            <span *ngIf="u.isProgramStaff" class="tag-program-staff">Program Staff</span>
          </div>
          <div class="actions-cell">
            <select #roleSel [ngModel]="u.role">
              <option value="super_admin">Super Admin</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="learner">Learner</option>
              <option value="guest">Guest</option>
              <option value="instructor">Instructor</option>
              <option value="tutor">Tutor</option>
              <option value="staff">Staff</option>
              <option value="programAdmin">Program Admin</option>
              <option value="programStaff">Program Staff</option>
              <option value="programLearner">Program Learner</option>
            </select>
            <button class="btn" (click)="changeRole(u.uid, roleSel.value)">Save role</button>
            <button class="btn" (click)="toggleProgramAdmin(u.uid, !!u.isProgramAdmin)">
              {{ u.isProgramAdmin ? 'Program Admin OFF' : 'Program Admin ON' }}
            </button>
            <button class="btn" (click)="toggleProgramStaff(u.uid, !!u.isProgramStaff)">
              {{ u.isProgramStaff ? 'Program Staff OFF' : 'Program Staff ON' }}
            </button>
            <button class="btn" (click)="toggleActive(u.uid, !!u.active)">
              {{ u.active ? 'Disable' : 'Enable' }}
            </button>
            <button class="btn" (click)="normalizeUser(u.uid)">Normalize</button>
            <a class="btn" [routerLink]="['/super-admin/users', u.uid, 'program-access']">Diagnose access</a>
            <a class="btn" [routerLink]="['/super-admin/users', u.uid, 'memberships']">Memberships</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
